<!doctype html><html><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>{% block title %}Personal Relevance Engine{% endblock %}</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:2rem auto;max-width:44rem;padding:0 1rem;line-height:1.5;color:#1a1a1a}
h1{font-size:1.4rem}
.item{border:1px solid #ddd;border-radius:10px;padding:.8rem 1rem;margin:1rem 0;background:#fff}
.score{font-weight:700}.flags{color:#b00;font-size:.85rem}
a.btn{display:inline-block;padding:.35rem 1rem;margin:.5rem .4rem 0 0;border-radius:6px;text-decoration:none;border:1px solid #888;color:inherit}
.act{background:#e7f5e7}.dismiss{background:#f5e7e7}
.muted{color:#666;font-size:.9rem}</style></head>
<body>{% block body %}{% endblock %}</body></html>
